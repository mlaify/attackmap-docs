name: docs-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install docs requirements, pytest and AttackMap with all plugins
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt pytest \
            "attackmap[all] @ git+https://github.com/mlaify/AttackMap.git"
      - name: Build the site
        run: mkdocs build --strict
      - name: Run docs tests
        run: pytest tests/
