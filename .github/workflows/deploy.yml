name: Deploy docs

# Builds the MkDocs Material site and publishes it to the gh-pages branch, which
# GitHub Pages serves at docs.matthewd.xyz (docs/CNAME pins the domain).
#
# Pull requests run `build` only — a full `mkdocs build --strict`, which fails on
# broken internal links and bad nav references, with no write permissions.
# Pushes to main additionally run `deploy`.
#
# The split into two jobs is deliberate: the deploy job needs contents:write to
# push the gh-pages branch, and PRs should never hold that. Job-level
# `permissions:` keeps the elevated scope off the build job entirely.

on:
  push:
    branches: [main]
  # Deliberately unfiltered. A `branches:` filter here matches the PR's BASE
  # branch, so `[main]` silently skips CI on any stacked PR — one targeting a
  # feature branch rather than main.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # --strict turns broken internal links and bad nav references into build
      # failures, so a typo cannot silently ship a 404.
      - name: Build site
        run: mkdocs build --strict

      - name: Sanity-check build output
        run: |
          test -f site/index.html || { echo "::error::site/index.html missing"; exit 1; }
          test -d site/search     || { echo "::error::site/search missing — search index not built"; exit 1; }
          test -f site/CNAME      || { echo "::error::site/CNAME missing — Pages would drop the custom domain"; exit 1; }
          echo "Build output looks sane ($(find site -type f | wc -l) files)."

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # gh-deploy rebuilds and force-pushes gh-pages. --no-history keeps that
      # branch from growing without bound.
      #
      # No live-site curl check afterwards on purpose: docs.matthewd.xyz sits
      # behind Cloudflare, which issues a JS challenge to non-browser clients
      # and returns 403 to Actions runners — that produced a red X on a deploy
      # that had actually succeeded.
      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force --no-history
