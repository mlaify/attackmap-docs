name: links

# Weekly external link check (docs#14). Internal links are already covered by
# `mkdocs build --strict` in docs-ci.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 5
            --retry-wait-time 10
            --accept 200,206,429,503
            --exclude-path site
            "docs/**/*.md" README.md
          fail: true
          # Authenticated requests, and 503 accepted: github.com throttles bulk
          # checks of blob pages with 503 even when authenticated (both runs
          # flagged valid links). A dead link is a 404, which still fails.
          token: ${{ secrets.GITHUB_TOKEN }}
